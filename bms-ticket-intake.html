<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS Ticket Intake</title>
  <style>
    :root {
      --navy: #10233f;
      --navy-dark: #0a1830;
      --blue: #2563eb;
      --gray-50: #f7f9fc;
      --gray-100: #eef2f7;
      --gray-300: #cbd5e1;
      --gray-600: #475569;
      --gray-800: #1e293b;
      --white: #ffffff;
      --focus: rgba(37, 99, 235, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--gray-100);
      color: var(--gray-800);
      line-height: 1.5;
    }

    .page {
      width: 100%;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: var(--white);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    .header {
      background: var(--navy);
      color: var(--white);
      padding: 28px 22px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.75rem, 6vw, 2.35rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .header p {
      margin: 0;
      color: #dbe7ff;
      font-size: 1rem;
    }

    form {
      padding: 24px 22px 28px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 1rem;
      color: var(--navy-dark);
    }

    .required {
      color: #dc2626;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--gray-300);
      border-radius: 10px;
      background: var(--gray-50);
      color: var(--gray-800);
      font: inherit;
      font-size: 1rem;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px var(--focus);
      background: var(--white);
    }

    textarea {
      resize: vertical;
    }

    textarea[name="raw_message"] {
      min-height: 160px;
    }

    input[type="file"] {
      padding: 11px 12px;
      background: var(--white);
    }

    .helper {
      margin: 8px 0 0;
      color: var(--gray-600);
      font-size: 0.92rem;
    }

    .submit-button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      background: var(--navy);
      color: var(--white);
      font-weight: 800;
      font-size: 1.08rem;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(16, 35, 63, 0.22);
    }

    .submit-button:hover,
    .submit-button:focus {
      background: var(--blue);
    }

    .submit-button:active {
      transform: translateY(1px);
    }

    @media (min-width: 640px) {
      .page {
        padding: 48px 24px;
      }

      .header {
        padding: 34px 36px;
      }

      form {
        padding: 32px 36px 36px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <header class="header">
        <h1 id="page-title">BMS Ticket Intake</h1>
        <p>Paste a client request below. This will be used to create a Kaseya BMS ticket.</p>
      </header>

      <form action="https://formspree.io/f/mkolpzzq" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="form_name" value="BMS Ticket Intake">
        <input type="hidden" name="workflow" value="zapier_bms_ticket_creation">
        <input type="hidden" name="_subject" value="New BMS Ticket Intake Submission">

        <div class="field">
          <label for="client">Client <span class="required" aria-hidden="true">*</span></label>
          <select id="client" name="client" required>
            <option value="" selected disabled>Select a client</option>
            <option value="Canterfield Prop">Canterfield Prop</option>
            <option value="Florida Women's Law Group">Florida Women's Law Group</option>
            <option value="Hayden Financial &amp; Insurance Solutions">Hayden Financial &amp; Insurance Solutions</option>
            <option value="KLB Financial Group">KLB Financial Group</option>
            <option value="Managed IT LLC">Managed IT LLC</option>
            <option value="Norman Law Jax">Norman Law Jax</option>
            <option value="Turn Key Jax">Turn Key Jax</option>
          </select>
        </div>

        <div class="field">
          <label for="priority">Priority <span class="required" aria-hidden="true">*</span></label>
          <select id="priority" name="priority" required>
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Very High">Very High</option>
          </select>
        </div>

        <div class="field">
          <label for="user">User <span class="required" aria-hidden="true">*</span></label>
          <input id="user" name="user" type="text" placeholder="Example: John Smith, Mary at reception, unknown" required>
        </div>

        <div class="field">
          <label for="source">Source <span class="required" aria-hidden="true">*</span></label>
          <select id="source" name="source" required>
            <option value="" selected disabled>Select a source</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Slack">Slack</option>
            <option value="Text Message">Text Message</option>
            <option value="Email">Email</option>
            <option value="Phone Call">Phone Call</option>
            <option value="Microsoft Teams">Microsoft Teams</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="raw_message">Raw Message <span class="required" aria-hidden="true">*</span></label>
          <textarea id="raw_message" name="raw_message" placeholder="Paste the client message, conversation, or your rough notes here." required></textarea>
        </div>

        <div class="field">
          <label for="internal_notes">Internal Notes</label>
          <textarea id="internal_notes" name="internal_notes" placeholder="Optional notes for the tech team."></textarea>
        </div>

        <div class="field">
          <label for="screenshot">Screenshot Upload</label>
          <input id="screenshot" name="screenshot" type="file" accept="image/*,.pdf">
          <p class="helper">Optional: upload a screenshot from WhatsApp, Slack, text, or email for reference.</p>
        </div>

        <button class="submit-button" type="submit">Submit Ticket Intake</button>
      </form>
    </section>
  </main>
</body>
</html>
